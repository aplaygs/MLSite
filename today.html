<!doctype html><html lang=ru><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сегодня · учебная платформа</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* «Сегодня» — главный экран платформы. Своя тональность: тёплая бумага и терракота, чтобы не путать с разделами;
   цвета разделов (ML — зелёный, English — голубой, колоды — янтарь) — только в их карточках. Данные — /api/today (today.py). */
:root{
  --bg:#F5F0E8; --surface:#FFFDF9; --ink:#221D17; --muted:#6E6455; --line:#E5DACA; --soft:#EEE6D9;
  --accent:#C4572E; --accent-soft:rgba(196,87,46,.12); --accent-ink:#FFF8F2;
  --tile:#2A231C; --tile-ink:#F8F1E6; --tile-muted:#C9BBA7;
  --ml:#2C7A50; --ml-soft:rgba(44,122,80,.12); --en:#3A6AD4; --en-soft:rgba(58,106,212,.12); --deck:#B7862A; --deck-soft:rgba(183,134,42,.14);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15120E; --surface:#1E1A15; --ink:#F1EADF; --muted:#A99D8C; --line:#342D25; --soft:#26211B;
  --accent:#F08A5D; --accent-soft:rgba(240,138,93,.15); --accent-ink:#1A120C;
  --tile:#F1E6D6; --tile-ink:#1E1812; --tile-muted:#6E6150;
  --ml:#5DBB87; --ml-soft:rgba(93,187,135,.15); --en:#8EB0F7; --en-soft:rgba(142,176,247,.15); --deck:#E0B456; --deck-soft:rgba(224,180,86,.15); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15120E; --surface:#1E1A15; --ink:#F1EADF; --muted:#A99D8C; --line:#342D25; --soft:#26211B;
  --accent:#F08A5D; --accent-soft:rgba(240,138,93,.15); --accent-ink:#1A120C;
  --tile:#F1E6D6; --tile-ink:#1E1812; --tile-muted:#6E6150;
  --ml:#5DBB87; --ml-soft:rgba(93,187,135,.15); --en:#8EB0F7; --en-soft:rgba(142,176,247,.15); --deck:#E0B456; --deck-soft:rgba(224,180,86,.15); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;margin:0;padding-inline:16px;padding-block:0 72px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:30px}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:500;letter-spacing:-.015em;text-wrap:balance}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* шапка */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;padding-top:34px}
.top h1{font-size:clamp(40px,7vw,68px);font-weight:700;line-height:1;margin:8px 0 12px}
.top p{margin:0;color:var(--muted);max-width:52ch}
.top p b{color:var(--ink);font-weight:600}
.ring{width:118px;height:118px}
.ring text{font-family:var(--f-display);font-weight:700;fill:var(--ink)}
.ring .cap{font-family:var(--f-mono);font-weight:500;font-size:9px;letter-spacing:.08em;fill:var(--muted)}
@media (max-width:560px){.top{grid-template-columns:1fr}.ring{display:none}}

/* главная плитка */
.start{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--tile);color:var(--tile-ink);
  border-radius:24px;padding:26px 28px;box-shadow:0 18px 40px -22px rgba(34,29,23,.55);transition:transform .15s ease,box-shadow .15s ease}
.start:hover{transform:translateY(-2px);box-shadow:0 22px 44px -22px rgba(34,29,23,.6)}
.start:active{transform:scale(.99)}
.start .lab{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tile-muted);display:flex;gap:8px;align-items:center}
.start .lab i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent))}
.start h2{font-size:clamp(22px,3.6vw,30px);font-weight:700;line-height:1.15;margin:8px 0 6px}
.start .sub{color:var(--tile-muted)}
.start .go{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.start.free{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.start.free .sub{color:var(--muted)}
@media (max-width:560px){.start{padding:20px;gap:14px}.start .go{width:48px;height:48px}.start .go svg{width:22px;height:22px}}

/* план на день */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-h h3{font-size:19px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.step a{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:14px 16px;transition:border-color .15s,transform .15s}
.step a:hover{border-color:var(--c);transform:translateX(2px)}
.step .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:600 15px var(--f-display);background:var(--cs);color:var(--c)}
.step .lab{font:500 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.step b{display:block;font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.step small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.step .pb{display:block;height:4px;border-radius:3px;background:var(--soft);margin-top:7px;overflow:hidden;max-width:260px}
.step .pb i{display:block;height:100%;background:var(--c);border-radius:3px}
.step .t{font:500 12.5px var(--f-mono);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:8px}
.step.done a{opacity:.62} .step.done .n{background:var(--c);color:var(--surface)} .step.done b{text-decoration:line-through;text-decoration-color:var(--line)}
@media (max-width:560px){.step a{grid-template-columns:36px minmax(0,1fr) auto;gap:12px;padding:12px 14px}.step .n{width:36px;height:36px}.step .t{font-size:11.5px;align-self:start;padding-top:2px}.step .t svg{display:none}}

/* неделя по разделам */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px;display:grid;gap:14px;align-content:start}
.wk-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;font:600 13px var(--f-body);padding:5px 12px 5px 6px;border-radius:999px;background:var(--cs);color:var(--c)}
.chip i{width:22px;height:22px;border-radius:50%;background:var(--c);color:var(--surface);display:grid;place-items:center;font:700 10px var(--f-mono);font-style:normal}
.wk-h .span{font:500 12px var(--f-mono);color:var(--muted)}
.big{display:flex;align-items:baseline;gap:10px}
.big b{font:700 40px/1 var(--f-display);letter-spacing:-.02em}
.big span{color:var(--muted)}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--c);transition:width .3s ease}
.ls{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ls a{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;margin-inline:-8px;border-radius:10px;font-size:14.5px}
.ls a:hover{background:var(--bg)}
.ls .m{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.ls .m.half{border-color:var(--c);background:conic-gradient(var(--c) var(--p),transparent 0)}
.ls .m.full{border-color:var(--c);background:var(--c)}
.ls .k{font:500 12px var(--f-mono);color:var(--muted)}
.wk .note{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.wk .note b{color:var(--ink);font-weight:600}
.wk .more{font:500 13px var(--f-body);color:var(--c);justify-self:start}

/* инструменты */
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tool{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;transition:border-color .15s}
.tool:hover{border-color:var(--c,var(--accent))}
.tool .ic{width:40px;height:40px;border-radius:12px;background:var(--cs,var(--accent-soft));color:var(--c,var(--accent));display:grid;place-items:center}
.tool b{display:block;font-weight:600;font-size:14.5px}
.tool small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
@media (max-width:420px){.tool{grid-template-columns:1fr}.tool small{display:none}}
.foot{color:var(--muted);font-size:13px;text-align:center}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;text-align:center;color:var(--muted)}
.ml{--c:var(--ml);--cs:var(--ml-soft)} .en{--c:var(--en);--cs:var(--en-soft)} .deck{--c:var(--deck);--cs:var(--deck-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<script src="/assets/nav.js"></script>
<div class="wrap" id="app">
  <header class="top">
    <div><div class="eyebrow" id="date"></div><h1>Сегодня</h1><p id="summary">Собираю план на день…</p></div>
    <svg class="ring" id="ring" viewBox="0 0 120 120" aria-hidden="true"></svg>
  </header>
  <div id="start"></div>
  <section><div class="sec-h"><h3>План на день</h3><span class="eyebrow" id="left"></span></div><ol class="steps" id="steps"></ol></section>
  <section><div class="sec-h"><h3>Неделя</h3><span class="eyebrow">темы и уроки недели</span></div><div class="two" id="weeks"></div></section>
  <section><div class="sec-h"><h3>Инструменты</h3></div><div class="tools" id="tools"></div></section>
  <p class="foot">Сайт пишет, Obsidian показывает: отмечай здесь, а с телефона смотри файлы недель.</p>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAYS=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const plural=(n,[a,b,c])=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c};
const dur=m=>!m?"":m<60?`~${m} мин`:`~${Math.floor(m/60)} ч${m%60>=10?` ${Math.round(m%60/5)*5} мин`:""}`;
const SEC={ml:{cls:"ml",short:"ML"},en:{cls:"en",short:"EN"},deck:{cls:"deck",short:"↻"}};
const I={
  arrow:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>',
  chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  cards:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="15" rx="2.5"/><path d="M8 3h10.5A2.5 2.5 0 0 1 21 5.5V17"/></svg>',
  brain:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1Z"/><path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/></svg>',
  tree:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22V11"/><path d="M12 14 7 9"/><path d="m12 12 5-5"/><circle cx="6" cy="8" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="5" r="2.5"/></svg>',
  cal:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  target:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>',
  book:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>'
};
const TOOLS=[["/words","deck","cards","Слова","колода слов, интервальное повторение"],["/rules","deck","brain","Правила на заучку","то, что трудно запомнить"],
  ["/plan","ml","cal","План ML","недели до собеседований"],["/tree","ml","tree","Дерево ML","все ветки и темы"],
  ["/hire","ml","target","Отборы","что спрашивают на стажировках"],["/en","en","book","English","план A2 → B2, уроки, тесты"]];

function ring(done,total){
  const C=2*Math.PI*48,p=total?done/total:0;
  $("ring").innerHTML=`<circle cx="60" cy="60" r="48" fill="none" stroke="var(--line)" stroke-width="10"/>
    <circle cx="60" cy="60" r="48" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 60 60)"/>
    <text x="60" y="62" text-anchor="middle" font-size="28">${done}/${total}</text><text class="cap" x="60" y="80" text-anchor="middle">ШАГОВ</text>`;
}
function stepHTML(x,k){
  const s=SEC[x.section]||SEC.deck, pr=x.progress&&x.progress[1]?`<span class="pb"><i style="width:${Math.round(x.progress[0]/x.progress[1]*100)}%"></i></span>`:"";
  return `<li class="step ${s.cls}${x.done?" done":""}"><a href="${x.href}"><span class="n">${x.done?I.check:k}</span>
    <span>${x.label?`<span class="lab">${esc(x.label)}</span>`:""}<b>${esc(x.title)}</b><small>${esc(x.done?"на сегодня всё повторено":x.sub)}</small>${pr}</span>
    <span class="t">${x.done?"готово":dur(x.minutes)}${I.chev}</span></a></li>`;
}
function weekHTML(s){
  const c=SEC[s.section]||SEC.ml, w=s.week, pct=w.total?Math.round(w.done/w.total*100):0;
  const ls=(w.lessons||[]).map(l=>{const p=l.topics[1]?l.topics[0]/l.topics[1]:0;
    return `<li><a href="${l.href}"><span class="m${l.done?" full":p>0?" half":""}" style="--p:${Math.round(p*100)}%"></span><span>${w.n}.${l.n} · ${esc(l.title)}</span><span class="k">${l.topics[0]}/${l.topics[1]}</span></a></li>`}).join("");
  const notes=[];
  if(s.tails.count)notes.push(`<div class="note"><span>⚠</span><span><b>Хвосты: ${s.tails.count}</b> — ${esc(s.tails.titles.slice(0,3).join(", "))}${s.tails.count>3?"…":""}</span></div>`);
  if(s.test){const t=s.test;notes.push(`<div class="note"><span>✎</span><span>${t.best!=null?`<b>Тест недели: лучший ${t.best}%</b>`:t.open?`<b>Тест недели можно проходить</b>`:"Тест недели — после трёх уроков"}</span></div>`)}
  return `<article class="wk ${c.cls}"><div class="wk-h"><span class="chip"><i>${c.short}</i>${esc(s.title)} · неделя ${w.n}</span><span class="span">${esc(w.span)}</span></div>
    <div class="big"><b>${w.done}<span style="font-size:22px;color:var(--muted)"> / ${w.total}</span></b><span>пройдено тем недели</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>${ls?`<ul class="ls">${ls}</ul>`:""}${notes.join("")}<a class="more" href="${s.home}">Открыть план раздела →</a></article>`;
}
async function boot(){
  const d=new Date(); $("date").textContent=`${DAYS[d.getDay()]} · ${d.getDate()} ${MON[d.getMonth()]}`;
  $("tools").innerHTML=TOOLS.map(([h,c,ic,t,s])=>`<a class="tool ${c}" href="${h}"><span class="ic">${I[ic]}</span><span><b>${t}</b><small>${s}</small></span></a>`).join("");
  let p;
  try{p=await fetch("/api/today").then(r=>{if(!r.ok)throw 0;return r.json()})}
  catch(e){$("summary").textContent="Нет связи с сервером: запусти «Тренажёр и дерево» (apps.py serve).";$("start").innerHTML="";return}
  const n=p.steps.length;
  ring(p.done,n);
  $("summary").innerHTML=p.start?`<b>${n-p.done} ${plural(n-p.done,["шаг","шага","шагов"])}</b> на сегодня · примерно <b>${dur(p.minutes_left).replace("~","")}</b>. Начни с повторения — оно короткое и держит слова в памяти.`
    :"<b>План на сегодня выполнен.</b> Можно взять урок вперёд или повторить колоды ещё раз.";
  $("left").textContent=p.minutes_left?`осталось ${dur(p.minutes_left)}`:"всё сделано";
  const st=p.start, sc=st?(SEC[st.section]||SEC.deck):null;
  $("start").innerHTML=st?`<a class="start ${sc.cls}" href="${st.href}" style="--c:var(--${st.section==="deck"?"deck":st.section})">
      <div><div class="lab"><i></i>Начать · ${esc(st.label||"повторение")} · ${dur(st.minutes)}</div><h2>${esc(st.title)}</h2><div class="sub">${esc(st.sub)}</div></div>
      <span class="go">${I.arrow}</span></a>`
    :`<div class="start free"><div><div class="lab">Свободно</div><h2>На сегодня всё сделано</h2><div class="sub">Отличный день. Загляни в план недели или повтори колоды ещё раз.</div></div></div>`;
  $("steps").innerHTML=p.steps.map((x,k)=>stepHTML(x,k+1)).join("")||`<li class="empty">Пока нечего делать: добавь слова из уроков или открой план.</li>`;
  $("weeks").innerHTML=p.sections.map(weekHTML).join("");
}
boot();
/* вернулся на вкладку после повторения или урока — план обновляется */
document.addEventListener("visibilitychange",()=>{if(!document.hidden)boot()});
</script>
</body></html>
