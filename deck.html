<!doctype html><html lang=ru><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Колода</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF3FA; --surface:#FFFFFF; --ink:#1A2335; --muted:#5D6982; --line:#D7E0EE; --soft:#E3EBF7;
  --accent:#3A6AD4; --accent-soft:rgba(58,106,212,.13); --accent-ink:#FFFFFF;
  --warm:#C9802A; --sun:#FBE6C4; --sun-soft:#FDF3E3; --sun-ink:#8A520E;
  --teal:#2A7584; --teal-soft:rgba(42,117,132,.12);
  --miss:#C9802A; --miss-soft:rgba(201,128,42,.14);
  --ok-soft:rgba(58,106,212,.12);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --surface:#161E2E; --ink:#E4EAF5; --muted:#98A3BA; --line:#283349; --soft:#1D2739;
  --accent:#8EB0F7; --accent-soft:rgba(142,176,247,.16); --accent-ink:#0C1528;
  --warm:#F2BE78; --sun:rgba(242,190,120,.2); --sun-soft:rgba(242,190,120,.09); --sun-ink:#F5CF97;
  --teal:#5BB3C2; --teal-soft:rgba(91,179,194,.16);
  --miss:#F2BE78; --miss-soft:rgba(242,190,120,.18);
  --ok-soft:rgba(142,176,247,.16); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#161E2E; --ink:#E4EAF5; --muted:#98A3BA; --line:#283349; --soft:#1D2739;
  --accent:#8EB0F7; --accent-soft:rgba(142,176,247,.16); --accent-ink:#0C1528;
  --warm:#F2BE78; --sun:rgba(242,190,120,.2); --sun-soft:rgba(242,190,120,.09); --sun-ink:#F5CF97;
  --teal:#5BB3C2; --teal-soft:rgba(91,179,194,.16);
  --miss:#F2BE78; --miss-soft:rgba(242,190,120,.18);
  --ok-soft:rgba(142,176,247,.16); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;padding-inline:16px;padding-block:0 64px;margin:0}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:24px}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* Шапка */
header.top{padding-block:32px 8px;display:grid;gap:10px}
header.top h1{font-size:clamp(28px,5vw,44px);font-weight:700;line-height:1.08}
header.top p{color:var(--muted);max-width:68ch;margin:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:540px){.kpis{gap:8px}.kp{padding:10px 11px;gap:3px;border-radius:13px}.kp .k{font-size:11.5px;line-height:1.25}.kp .v{font-size:22px}.kp .sub{display:none}header.top{padding-block:20px 0}}
.kp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:6px;align-content:start}
.kp .k{font-size:12.5px;color:var(--muted)}
.kp .v{font:700 32px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.kp .sub{font-size:12.5px;color:var(--muted)}
.kp.new .v{color:var(--accent)}

/* Quizlet */
.qz-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:12px}
.qz-panel h2{font-size:19px;font-weight:600}
.qz-btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:600 15px/1 var(--f-body);border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.qz-msg{font-size:14px;color:var(--muted)}
.qz-panel details summary{cursor:pointer;color:var(--accent);font-weight:500;font-size:14.5px}
.w-q{font:600 11px var(--f-mono);padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.w-q.new{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* Правая колонка: словарь */
.dict-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px;align-content:start}
.dict-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.dict-head h3{font-size:17px;font-weight:600}
.dict-count{font:600 12px var(--f-mono);color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.search-box{position:relative}
.search-in{width:100%;font:500 14px var(--f-body);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 36px;outline:none;transition:border-color .15s}
.search-in:focus{border-color:var(--accent)}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}

.dict-filters{display:flex;gap:4px;flex-wrap:wrap}
.f-chip{font:500 12px var(--f-mono);background:var(--soft);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer;transition:all .15s}
.f-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

.word-list{display:grid;gap:4px;max-height:640px;overflow-y:auto;padding-right:4px}
.word-list::-webkit-scrollbar{width:6px}
.word-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.w-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid transparent;transition:all .15s;align-items:center}
.w-row:hover{border-color:var(--line);background:var(--soft)}
.w-main{display:grid;gap:2px}
.w-word{font-weight:600;font-size:14.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.w-say{background:transparent;border:0;cursor:pointer;padding:4px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s ease;flex-shrink:0;vertical-align:middle}
.w-say:hover{background:var(--accent-soft);color:var(--accent)}
.w-say svg{display:block}
.w-ipa{font:400 12px var(--f-mono);color:var(--muted)}
.w-tr{font-size:13px;color:var(--muted)}
.w-tr em{font-style:italic;color:var(--ink);font-weight:500}
.w-meta{text-align:right;display:grid;gap:4px;justify-items:end}
.w-box-tag-unused{font:600 11px var(--f-mono);padding:2px 7px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.w-box-tag.due{background:var(--miss-soft);color:var(--miss);border-color:rgba(201,128,42,.3)}
.w-box-tag.learned{background:var(--teal-soft);color:var(--teal);border-color:rgba(42,117,132,.3)}
.w-due{font:500 11px var(--f-mono);color:var(--muted)}

.empty{color:var(--muted);text-align:center;font-size:14.5px;padding:24px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
 .w-rule-a{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Добавить и убрать */
.add-btn{font:600 13px var(--f-body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.add-form{display:grid;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}
.add-form[hidden]{display:none}
.add-form label{display:grid;gap:4px;font:500 12px var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.add-form input,.add-form textarea{font:15px var(--f-body);padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;width:100%}
.add-form textarea{min-height:64px;resize:vertical}
.add-form input:focus,.add-form textarea:focus{outline:none;border-color:var(--accent)}
.add-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:540px){.add-row{grid-template-columns:1fr}}
.add-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.add-act button{font:600 14px var(--f-body);border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.add-act button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.add-msg{font-size:13px;color:var(--muted)}
.w-act{font:500 12px var(--f-body);background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:3px 8px;cursor:pointer}
.w-act:hover{border-color:var(--miss);color:var(--miss)}
.w-act.back{color:var(--accent)} .w-act.back:hover{border-color:var(--accent)}
.w-row.arch{opacity:.72}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:30;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.toast button{font:600 13px var(--f-body);background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script src="/assets/nav.js"></script>
<div class="wrap">
  <header class="top">
    <div class="eyebrow" id="hEye">English · колода</div>
    <h1 id="hTitle">Колода</h1>
    <p id="hDesc"></p>
  </header>

  <div class="kpis" aria-live="polite">
    <div class="kp"><span class="k">Всего</span><span class="v" id="sTotal">0</span><span class="sub" id="sTotalSub"></span></div>
    <div class="kp"><span class="k">Уже в Quizlet</span><span class="v" id="sIn">0</span><span class="sub">помечены после копирования</span></div>
    <div class="kp new"><span class="k">Новых для Quizlet</span><span class="v" id="sNew">0</span><span class="sub">ещё не перенесены</span></div>
  </div>

  <section class="qz-panel" aria-labelledby="qzH">
    <h2 id="qzH">Перенести в Quizlet</h2>
    <div class="qz-btns">
      <button class="btn go" id="bNew" type="button" disabled>Скопировать новые</button>
      <button class="btn" id="bAll" type="button" disabled>Скопировать все</button>
      <a class="btn" id="bOpen" href="https://quizlet.com/create-set" target="_blank" rel="noopener">Открыть Quizlet ↗</a>
      <span class="qz-msg" id="qzMsg" role="status"></span>
    </div>
    <details id="how"><summary>Как вставить в Quizlet</summary><div id="howBody"></div></details>
  </section>

  <div class="dict-panel">
    <div class="dict-head">
      <h3 id="listTitle">В колоде</h3>
      <span style="display:flex;gap:8px;align-items:center"><span class="dict-count" id="dictCount">0</span><button class="add-btn" id="addToggle" type="button" aria-expanded="false">＋ Добавить</button></span>
    </div>
    <form class="add-form" id="addForm" hidden autocomplete="off"></form>
    <div class="search-box">
      <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-in" id="search" type="search" placeholder="Поиск…" autocomplete="off" spellcheck="false">
    </div>
    <div class="dict-filters" id="filters" role="group" aria-label="Фильтр">
      <button class="f-chip" data-f="all" type="button" aria-pressed="true">Все</button>
      <button class="f-chip" data-f="new" type="button" aria-pressed="false">Новые</button>
      <button class="f-chip" data-f="in" type="button" aria-pressed="false">В Quizlet</button>
      <button class="f-chip" data-f="arch" type="button" aria-pressed="false" id="fArch">Убранные</button>
    </div>
    <div class="word-list" id="list" role="list"><div class="empty">Загрузка…</div></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="toastBtn">Вернуть</button></div>

<script src="/assets/quizlet.js"></script>
<script>
/* Колода для Quizlet: /words — слова, /rules — правила. Учит Влад в Quizlet; здесь — что собрано из уроков и вручную,
   что уже перенесено в Quizlet и кнопки «скопировать для импорта». Данные — /api/decks/<колода> (decks.py), строки — quizlet.js. */
const DECK=location.pathname.startsWith("/rules")?"rules":"words";
const CONF={
  words:{title:"Слова",eye:"English · слова для Quizlet",unit:["слово","слова","слов"],list:"Слова",
    desc:"Учишь в Quizlet. Здесь — все слова из уроков и добавленные вручную. «Скопировать новые» — то, что ещё не переносил: вставь в Quizlet через «Импорт». Ненужное убирай — уйдёт в архив, его можно вернуть.",
    search:"Поиск слова или перевода…"},
  rules:{title:"Правила на заучку",eye:"English · правила для Quizlet",unit:["правило","правила","правил"],list:"Правила",
    desc:"Правила, которые трудно запомнить, — учишь в Quizlet отдельным набором. Карточка «вопрос → правило», а где есть типичная ошибка — ещё «Исправь: … → как верно».",
    search:"Поиск по вопросу или правилу…"}
}[DECK];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ruDate=iso=>{const [,m,d]=(iso||"").split("-");return d&&m?`${d}.${m}`:""};
const plural=(n,[a,b,c])=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c};
const fmt=s=>esc(s).replace(/\*([^*]+)\*/g,"<em>$1</em>").replace(/`([^`]+)`/g,"<code>$1</code>");
const SPK=(w=14)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;

/* ---------- голос (британский, без «шуточных» голосов macOS) ---------- */
let VOICE=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const FUN=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Junior|Ralph|Fred|Kathy|Princess|Deranged|Hysterical|Pipe|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
  const v=speechSynthesis.getVoices().filter(x=>/^en[-_]/.test(x.lang)&&!FUN.test(x.name));
  VOICE=v.find(x=>x.lang==="en-GB"&&/natural|neural|premium|enhanced/i.test(x.name))||v.find(x=>x.lang==="en-GB"&&/google uk|serena|oliver|stephanie|martha|daniel|kate/i.test(x.name))
    ||v.find(x=>x.lang==="en-GB")||v.find(x=>/samantha|ava|allison|google us/i.test(x.name))||v[0]||null;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){if(!("speechSynthesis" in window)||!t)return;const u=new SpeechSynthesisUtterance(String(t));if(!VOICE)pickVoice();
  if(VOICE)u.voice=VOICE;u.lang=VOICE?VOICE.lang:"en-GB";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b)say(b.dataset.say)});

/* ---------- состояние ---------- */
let all=[],online=false,filter="all",query="";
const live=()=>all.filter(c=>!c.archived);
const fresh=()=>live().filter(c=>!c.quizlet);
const lines=cards=>DECK==="words"?QZ.words(cards):QZ.rules(cards);

function stats(){
  const L=live(),arch=all.length-L.length,n=fresh().length;
  $("sTotal").textContent=L.length;$("sTotalSub").textContent=arch?`ещё ${arch} в архиве`:`${plural(L.length,CONF.unit)} в колоде`;
  $("sIn").textContent=L.length-n;$("sNew").textContent=n;
  $("dictCount").textContent=`${L.length} ${plural(L.length,CONF.unit)}`;$("fArch").textContent=arch?`Убранные · ${arch}`:"Убранные";
  $("bNew").disabled=!n;$("bNew").textContent=n?`Скопировать новые · ${n}`:"Новых нет";$("bAll").disabled=!L.length;
}
function renderList(){
  const q=query.toLowerCase().trim();
  let L=filter==="arch"?all.filter(c=>c.archived):live();
  if(filter==="new")L=L.filter(c=>!c.quizlet);else if(filter==="in")L=L.filter(c=>c.quizlet);
  if(q)L=L.filter(c=>(DECK==="words"?[c.word,c.translation]:[c.q,c.a,c.source]).join(" ").toLowerCase().includes(q));
  L.sort((a,b)=>DECK==="words"?a.word.localeCompare(b.word):(a.source||"").localeCompare(b.source||"",undefined,{numeric:true})||a.q.localeCompare(b.q));
  $("list").innerHTML=L.map(c=>{
    const main=DECK==="words"
      ?`<div class="w-word">${esc(c.word)} <button class="w-say" data-say="${esc(c.word)}" type="button" aria-label="Послушать">${SPK()}</button>${c.ipa?` <span class="w-ipa">[${esc(c.ipa)}]</span>`:""}</div><div class="w-tr">${fmt(c.translation)}</div>`
      :`<div class="w-word">${fmt(c.q)}</div><div class="w-rule-a">${fmt(c.a)}</div>`;
    const meta=c.archived?`<button class="w-act back" data-id="${esc(c.id)}" data-op="restore" type="button">Вернуть</button>`
      :`${c.quizlet?`<button class="w-q" data-id="${esc(c.id)}" data-op="unq" type="button" title="Снять отметку — карточка снова будет среди новых">в Quizlet ${ruDate(c.quizlet)}</button>`:`<span class="w-q new">новое</span>`}<button class="w-act" data-id="${esc(c.id)}" data-op="archive" type="button" title="Убрать (можно вернуть)">Убрать</button>`;
    return `<div class="w-row${c.archived?" arch":""}" role="listitem"><div class="w-main">${main}${c.source?`<div class="w-due">${esc(c.source)}</div>`:""}</div><div class="w-meta">${meta}</div></div>`;
  }).join("")||`<div class="empty">${q?"Ничего не найдено":filter==="arch"?"Архив пуст.":filter==="new"?"Всё уже в Quizlet.":"Пока пусто: отметь слова и правила в конце урока в блоке «В Quizlet» или нажми «＋ Добавить»."}</div>`;
}
$("list").addEventListener("click",e=>{const b=e.target.closest("[data-op]");if(!b)return;
  if(b.dataset.op==="unq")return mark([b.dataset.id],false);setArchived(b.dataset.id,b.dataset.op==="archive")});
$("search").addEventListener("input",e=>{query=e.target.value;renderList()});
$("filters").addEventListener("click",e=>{const b=e.target.closest(".f-chip");if(!b)return;
  document.querySelectorAll(".f-chip").forEach(x=>x.setAttribute("aria-pressed",x===b));filter=b.dataset.f;renderList()});

/* ---------- сервер ---------- */
const API="/api/decks/"+DECK;
async function post(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
function applyCards(cards){all=cards;stats();renderList()}
let toastT=null;
function toast(msg,undo){$("toastMsg").textContent=msg;$("toastBtn").hidden=!undo;$("toastBtn").onclick=()=>{$("toast").hidden=true;undo&&undo()};
  $("toast").hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>$("toast").hidden=true,6000)}
async function setArchived(id,arch){
  if(!online)return toast("Нет связи с сервером");
  const c=all.find(x=>x.id===id),name=c?(c.word||c.q):id;
  try{const r=await post({op:arch?"archive":"restore",id});applyCards(r.cards);
    toast(arch?`«${name.slice(0,40)}» убрано в архив`:`«${name.slice(0,40)}» снова в колоде`,arch?()=>setArchived(id,false):null)}
  catch(e){toast("Не получилось: "+(e.message||e))}
}
async function mark(ids,on){
  if(!online||!ids.length)return;
  try{applyCards((await post({op:"quizlet",ids,on})).cards)}catch(e){toast("Отметка не сохранилась: "+(e.message||e))}
}
function copyCards(cards,markThem){
  const L=lines(cards); if(!L.length)return;
  const ok=QZ.copy(L.join("\n"));
  $("qzMsg").innerHTML=ok?`✓ Скопировано ${L.length} ${plural(L.length,["карточка","карточки","карточек"])} — вставь в Quizlet через «Импорт».`:"Не скопировалось — браузер не дал доступ к буферу.";
  $("how").open=true;
  if(ok&&markThem)mark(cards.map(c=>c.id),true);
}
$("bNew").onclick=()=>copyCards(fresh(),true);
$("bAll").onclick=()=>copyCards(live(),true);

/* ---------- добавить вручную ---------- */
const FORM=DECK==="words"
  ?`<div class="add-row"><label>Слово или фраза *<input name="word" required></label><label>Перевод *<input name="translation" required></label></div>
    <div class="add-row"><label>Транскрипция<input name="ipa" placeholder="без скобок"></label><label>Пример по-английски<input name="example"></label></div>
    <label>Перевод примера<input name="example_ru"></label>`
  :`<label>Вопрос к себе *<input name="q" required placeholder="Когда у глагола -s?"></label>
    <label>Правило *<textarea name="a" required placeholder="Коротко, своими словами. *курсив* — для английских слов."></textarea></label>
    <label>Примеры — каждый с новой строки<textarea name="examples" placeholder="She works in a bank."></textarea></label>
    <div class="add-row"><label>Ошибка (как неправильно)<input name="wrong"></label><label>Как правильно<input name="right"></label></div>`;
$("addForm").innerHTML=FORM+`<div class="add-act"><button class="go" type="submit">Добавить</button><button type="button" id="addCancel">Отмена</button><span class="add-msg" id="addMsg" role="status"></span></div>`;
const toggleForm=open=>{$("addForm").hidden=!open;$("addToggle").setAttribute("aria-expanded",open);if(open)$("addForm").querySelector("input").focus()};
$("addToggle").onclick=()=>toggleForm($("addForm").hidden);
$("addCancel").onclick=()=>toggleForm(false);
$("addForm").onsubmit=async e=>{
  e.preventDefault();if(!online){$("addMsg").textContent="Нет связи с сервером";return}
  const f=Object.fromEntries(new FormData($("addForm")));
  const item=DECK==="words"?{...f,source:"вручную"}:{q:f.q,a:f.a,wrong:f.wrong,right:f.right,source:"вручную",examples:(f.examples||"").split("\n").map(s=>s.trim()).filter(Boolean)};
  try{const r=await post({op:"add",items:[item]});applyCards(r.cards);
    if(r.added.length||r.restored.length){$("addForm").reset();$("addMsg").textContent=(r.added.length?"Добавлено ✓":"Было в архиве — вернул ✓")+" Оно среди новых для Quizlet.";$("addForm").querySelector("input").focus()}
    else $("addMsg").textContent=r.skipped[0]?.why==="уже в колоде"?"Уже есть в колоде":"Не добавлено: "+(r.skipped[0]?.why||"");
  }catch(err){$("addMsg").textContent="Ошибка: "+(err.message||err)}
};

async function boot(){
  document.title=CONF.title;$("hTitle").textContent=CONF.title;$("hEye").textContent=CONF.eye;$("hDesc").textContent=CONF.desc;
  $("listTitle").textContent=CONF.list;$("search").placeholder=CONF.search;$("howBody").innerHTML=QZ.howto(DECK);
  try{const d=await fetch(API).then(r=>{if(!r.ok)throw 0;return r.json()});all=d.cards||[];online=true;
    if(new URLSearchParams(location.search).has("add"))toggleForm(true);}
  catch(e){$("qzMsg").textContent="Нет связи с сервером: запусти apps.py."}
  stats();renderList();
}
boot();
</script>
